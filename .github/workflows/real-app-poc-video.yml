name: Real App PoC Video

on:
  workflow_dispatch:

permissions: read-all

jobs:
  real-app-poc-video:
    name: Real GlotPress dummy-data PoC video
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        ports:
          - 3306/tcp
        env:
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: "--no-progress --no-ansi --no-interaction"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Install WordPress test setup
        run: bash bin/install-wp-tests.sh wordpress_test root password 127.0.0.1:${{ job.services.mysql.ports[3306] }} latest

      - name: Start real GlotPress PoC harness
        run: |
          WP_TESTS_DIR=/tmp/wordpress-tests-lib php -S 127.0.0.1:8899 -t tests/poc > /tmp/glotpress-real-app-poc.log 2>&1 &
          echo $! > /tmp/glotpress-real-app-poc.pid
          sleep 3
          curl --fail http://127.0.0.1:8899/real-app-bulk-boundary-poc.php > /dev/null

      - name: Record browser PoC
        run: node tests/poc/record-real-app-poc.js

      - name: Upload PoC video and server log
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: glotpress-real-app-dummy-data-poc
          path: |
            poc-artifacts/glotpress-real-app-dummy-data-poc.webm
            /tmp/glotpress-real-app-poc.log
